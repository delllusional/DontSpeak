name: Fuzz (scheduled)

# Fuzzes ds-ipc's untrusted wire-protocol parsers. The independent fuzz workspace uses
# nightly only in this scheduled Linux job, leaving the main workspace on stable.
on:
  schedule:
    - cron: '43 5 * * 1'   # weekly, Monday
  workflow_dispatch: {}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_request, parse_response]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=180
        working-directory: rust/crates/ds-ipc/fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: rust/crates/ds-ipc/fuzz/artifacts/${{ matrix.target }}/
