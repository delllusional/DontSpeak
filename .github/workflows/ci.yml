name: CI

# Run the project's ACTUAL test suite. The bulk lives in the Rust workspace
# (cargo test --workspace); the macOS SwiftPM packages add app and DontSpeakMLX tests, and
# the WinUI app adds winui.tests (xunit) — each on its own OS leg.
#
# Cost/coverage split:
#   • Per commit / PR  → Linux only, essentials only (script tests + clippy + Rust tests;
#     covers the platform-agnostic majority).
#   • Release pipeline → clippy + tests on the FULL ubuntu + windows-2025 + macos-26
#     matrix, PLUS the hygiene gate (rustfmt + rustdoc) AND cargo-deny
#     (advisories/bans/licenses/sources), so the macOS MLX and Windows CUDA paths
#     are compiled, linted, and tested on their own OS — and format/doc drift +
#     dependency-graph issues are cleaned up — before anything is built or published.
#     release.yml calls this with full-matrix: true, plus mlx-tests when the DontSpeakMLX
#     package itself moved since the last release (see that step's comment).
#     cargo-deny is release-only, same reasoning as hygiene: it's a considered gate
#     (license/advisory exceptions need a deliberate deny.toml change, not a reflexive
#     fix), so it's cheaper to clear once per release than to nag every commit. The
#     scheduled dependency-audit.yml still re-runs advisories daily in between, since a
#     newly-disclosed RustSec advisory against an unchanged Cargo.lock has no commit to
#     attach a per-commit check to.
# This is `workflow_call`-able so the release reuses the EXACT same test definition.

on:
  # Per-commit + PR test runs (Linux-only — the fast, platform-agnostic majority).
  # Branches only: a tag push carries a commit that already ran this workflow on its
  # branch, and release.yml re-runs it via workflow_call as the full-matrix gate. Without
  # the filter both land on the SAME ref, so `concurrency` (cancel-in-progress: false)
  # serializes them and the redundant run delays the release.
  # Must be `branches: ['**']`, NOT `tags-ignore` — a push trigger carrying only tag
  # filters stops firing on branch pushes altogether, and silently: a workflow that never
  # triggers produces no run, no annotation, nothing to notice.
  push:
    branches: ['**']
  pull_request:
  # Manual runs (workflow_dispatch) and the release gate (workflow_call from release.yml)
  # also run tests; the release passes full-matrix: true for all three OSes. Manual runs
  # can too (gh workflow run ci.yml --ref <branch> -f full-matrix=true) — the way to get
  # a macOS/Windows compile of cfg-gated code onto a branch BEFORE the release gate,
  # e.g. after touching macOS-only unsafe code that Linux per-commit CI never builds.
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Run on all three OSes (Linux + Windows + macOS) instead of just Linux.
        type: boolean
        default: false
      mlx-tests:
        description: Also run the DontSpeakMLX shim suite (~7 min of Metal xcodebuild).
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-matrix:
        description: Run on all three OSes (Linux + Windows + macOS) instead of just Linux.
        type: boolean
        default: false
      mlx-tests:
        description: Also run the DontSpeakMLX shim suite (~7 min of Metal xcodebuild).
        type: boolean
        default: false

# Never cancel a run: every per-commit check should FINISH (green), so a commit on the
# branch page never shows a cancelled (red) mark. Grouped per ref, so the release's
# full-matrix gate (a tag ref) is independent of the per-commit branch check — they run in
# parallel and both go green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release-only hygiene: per-commit CI intentionally runs only clippy and tests.
  hygiene:
    name: hygiene (rustfmt + rustdoc)
    if: inputs.full-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build-deps
      # Runner images lag freshly-released toolchains by days; install current stable
      # explicitly instead of trusting whatever ubuntu-latest ships, so a workspace
      # rust-version bump (rust/Cargo.toml) never outpaces what CI can actually build.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Only `rust`: this job's GTK step is `cargo fmt`, which builds nothing, so a
          # gtk workspace entry would cache an empty target dir and drag that crate's
          # Cargo.lock into the hygiene cache key.
          workspaces: rust -> target
      - name: cargo fmt --check (rust workspace)
        working-directory: rust
        run: cargo fmt --all --check
      - name: cargo fmt --check (GTK host crate)
        working-directory: apps/linux/gtk
        run: cargo fmt --all --check
      - name: cargo doc -D warnings
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Clippy gate: deny ALL warnings across the workspace + every target (incl. tests). It uses
  # the same cost/coverage split as the test job: Linux per commit, then all three OSes for a
  # full-matrix run so cfg-gated macOS and Windows code is linted on its native platform.
  clippy:
    needs: setup
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-build-deps
        if: runner.os == 'Linux'

      - uses: ./.github/actions/ring-asm-windows
        if: runner.os == 'Windows'

      # See the hygiene job's comment above: pin to current stable explicitly rather
      # than the runner image's baked-in rustc.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: cargo clippy -D warnings
        working-directory: rust
        # --keep-going: lint every crate even after one fails, so a multi-crate workspace
        # surfaces ALL lints in one run instead of stopping at the first.
        run: cargo clippy --workspace --all-targets --keep-going --locked -- -D warnings

  # cargo-deny gate — RELEASE-ONLY (same `if` as hygiene above): advisories (RustSec) +
  # bans (duplicate/banned crates) + licenses (rust/deny.toml's [licenses.allow]) +
  # sources (only crates.io, no stray git/registry
  # deps), across both the main Rust workspace and standalone GTK host. Deliberately
  # skipped per-commit — a new advisory or license entering either graph needs a
  # considered deny.toml change (dated reason, scoped exception), not a
  # reflexive fix on every push; the release enforces it once, same rationale as
  # rustfmt/rustdoc. dependency-audit.yml's daily schedule still catches newly-disclosed
  # advisories against an unchanged Cargo.lock in between releases.
  # Linux-only, no OS matrix — unlike clippy/test, this is dependency-GRAPH analysis.
  # deny.toml's [graph] targets = [] (unset) means cargo-deny already evaluates every
  # platform's conditional dependencies regardless of which OS runs the check. The job
  # matrix is by Cargo.lock graph, not runner OS; GTK reuses the same policy file.
  cargo-deny:
    name: cargo-deny (${{ matrix.graph }})
    if: inputs.full-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: Rust workspace
            manifest: rust/Cargo.toml
          - graph: Linux GTK host
            manifest: apps/linux/gtk/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      # Pin v2's cargo-deny 0.20.2 invocation: --config is a repo-root option before `check`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features --config rust/deny.toml

  # Repository automation has its own focused tests. Keep this separate from the Rust
  # matrix: the scripts are platform-agnostic, and one Linux run catches hook/coverage
  # regressions without repeating the same Node suite on every release OS.
  script-tests:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: node script tests
        run: node --test scripts/agents/agent-attribution.test.mjs scripts/ci/merge-crate-coverage.test.js scripts/install/web/install.test.mjs
      - name: python script tests
        run: python3 scripts/release/release-stats.test.py
      - name: macOS bundle script tests
        run: bash apps/macos/bundle-lib.test.sh

  # Pick the shared clippy/test OS matrix: Linux-only by default, all three when
  # full-matrix is requested (the release gate). push/PR events have no `inputs`, so
  # they fall to Linux-only.
  setup:
    name: test matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        run: |
          if [ "${{ inputs.full-matrix }}" = "true" ]; then
            echo 'os=["ubuntu-latest","windows-2025","macos-26"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-build-deps
        if: runner.os == 'Linux'

      - uses: ./.github/actions/ring-asm-windows
        if: runner.os == 'Windows'

      # See the hygiene job's comment above: pin to current stable explicitly rather
      # than each runner image's baked-in rustc (works cross-OS, unlike a raw rustup call).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # A skipped-by-default live test is still part of the test harness: `cargo test
      # -- --ignored` can run it on a developer machine with real credentials, devices,
      # or user data. Live validation belongs in explicit scripts/examples; the Rust test
      # harness stays hermetic on every invocation (see AGENTS.md).
      - name: reject ignored Rust tests
        shell: bash
        run: |
          if git grep -n -F '#[ignore' -- 'rust/**/*.rs'; then
            echo "::error::Rust test harness contains #[ignore]; replace live-resource tests with mocks or move manual validation outside cargo test"
            exit 1
          fi

      # cfg-gated platform code (macOS MLX, Windows CUDA EP) compiles on its
      # own OS via the matrix, so on the full-matrix release run every test executes
      # somewhere. --locked: build exactly the committed Cargo.lock, fail on drift.
      - name: fetch Rust dependencies
        working-directory: rust
        run: cargo fetch --locked

      - name: cargo test (workspace)
        working-directory: rust
        env:
          # Fetch first, then keep Cargo and test HTTP clients offline. Loopback remains
          # available for httpmock and local protocol fixtures.
          CARGO_NET_OFFLINE: 'true'
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
          HF_HUB_OFFLINE: '1'
        run: cargo test --workspace --locked --offline

      # Gate for issue #26: ds_log::log_cached (the log::Log facade sink) always resolves
      # the REAL per-OS log path and writes there unconditionally, bypassing test
      # isolation. No test is supposed to reach it — this fails the build the moment one
      # does, instead of relying on every reviewer remembering the rule. CI runners are
      # fresh per run, so the target file can only exist if this run's `cargo test` step
      # created it.
      - name: verify tests didn't leak into the real log file (issue #26)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   log_file="${XDG_STATE_HOME:-$HOME/.local/state}/dontspeak/logs/dontspeak.log" ;;
            macOS)   log_file="$HOME/Library/Logs/DontSpeak/dontspeak.log" ;;
            Windows) log_file="${LOCALAPPDATA}/DontSpeak/logs/dontspeak.log" ;;
          esac
          if [ -f "$log_file" ]; then
            echo "::error::cargo test wrote to $log_file — a test path reached ds_log::log_cached, which always resolves the real per-OS log file and ignores test isolation (see issue #26). Route the caller through ds_log::log()/log_from() with a caller-supplied (tempdir) path instead."
            exit 1
          fi

      # macOS SwiftUI app: run swift test only if the package declares test targets.
      - name: swift test (macOS app, if any)
        if: runner.os == 'macOS'
        env:
          # Pin the staticlib to the app's macOS floor (Package.swift .macOS(.v14)) so the
          # swift-test link doesn't warn "built for newer macOS" — same pin as build.sh.
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          if grep -q 'testTarget' apps/macos/Package.swift 2>/dev/null; then
            # Package.swift force_loads ../../rust/target/release-ffi/libds_core.a (the
            # FFI staticlib, release-ffi profile — see apps/macos/build.sh). swift test links
            # it, so build it FIRST or the link fails with "library ... not found".
            ( cd rust && cargo build --profile release-ffi --locked -p ds-core )
            cd apps/macos && swift test
          else
            echo "no Swift test targets in apps/macos/Package.swift — skipping"
          fi

      # Gated on mlx-tests, which release.yml's `check` job sets when apps/macos/DontSpeakMLX
      # differs from the last real release tag. The suite's inputs are that one directory
      # (sources, tests, and the mlx-swift / mlx-audio-swift versions pinned in
      # Package.resolved) plus Xcode, which the macos build job still recompiles the shim
      # against on every image bump — so an unchanged package is already proven by the release
      # that ran this. Corollary: a red run must be fixed inside the package, or the next tag
      # skips it as "unchanged".
      - name: xcodebuild test (macOS DontSpeakMLX shim)
        if: runner.os == 'macOS' && inputs.mlx-tests
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        working-directory: apps/macos/DontSpeakMLX
        # MLX's Metal shaders are an Xcode-generated SwiftPM resource bundle. A plain
        # `swift test` builds the code but aborts the first GPU-backed test without it.
        run: |
          xcodebuild test \
            -scheme DontSpeakMLX-Package \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode-tests \
            -quiet

      # WinUI xunit tests; the composite is shared with csharp.yml.
      - name: dotnet test (WinUI app)
        if: runner.os == 'Windows'
        uses: ./.github/actions/dotnet-test-winui
