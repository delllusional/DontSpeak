name: Dependency audit (scheduled)

# Catches newly-disclosed RustSec advisories against dependencies that HAVEN'T changed —
# the cargo-deny job in ci.yml is release-only (see AGENTS.md's Gates section) and only
# re-evaluates when a commit touches the dependency graph AND a release gets cut; a new
# CVE against either already-resolved Cargo.lock, with no release imminent, has nothing to
# attach to otherwise, so it needs a timer. Advisories-only (bans/licenses/sources only
# change with a Cargo.lock edit, already covered at release time — re-running them here
# is pure duplication).
#
# Caveat: GitHub auto-disables scheduled workflows after 60 days with no repo commits
# (public-repo cost control) — not a concern at this repo's commit cadence, but if this
# job silently stops running, that's why; re-enable from the Actions tab.
on:
  schedule:
    - cron: '17 6 * * *'   # daily, off the top of the hour
  workflow_dispatch: {}

jobs:
  cargo-deny-advisories:
    name: cargo-deny advisories (${{ matrix.graph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: Rust workspace
            manifest: rust/Cargo.toml
            config: deny.toml
          - graph: Linux GTK host
            manifest: apps/linux/gtk/Cargo.toml
            config: ../../../rust/deny.toml
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          # The action runs from the manifest's directory. The GTK workspace reuses
          # rust/deny.toml so dependency policy remains single-source.
          command-arguments: --config ${{ matrix.config }} advisories
