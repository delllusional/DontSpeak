name: Release

# Build the Windows portable zips (self-contained — x64 + ARM64) and the macOS app zips
# (signed + notarized DontSpeak.app — Apple silicon AND Intel/x86_64) on a version tag,
# then publish them to a GitHub Release alongside the Linux tarballs, fixed-name
# one-command installers, and checksums.txt. The installers download + verify the
# platform packages from that same release.
# Trigger by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Runner labels are pinned to the current images (mid-2026): windows-2025 (Windows
# Server 2025 / VS 2026) and macos-26 (arm64, Xcode 26) — see runner-images. The
# release is created with the `gh` CLI (GitHub-maintained) rather than a third-party
# action.
#
# macOS signing is GATED on secrets (see docs/SIGNING.md): the full Developer ID sign +
# notarize path runs when APPLE_* secrets exist, else the app is ad-hoc-signed (first
# launch hits Gatekeeper). The Windows portable zip is self-contained and unsigned (the
# app runs from an extracted folder; SmartScreen may warn on first run).
#
# Pushing a tag whose name contains "-dev" (the current -dev version already on main,
# from rust/Cargo.toml's [workspace.package] version) runs this same full matrix, but the
# `release` job publishes it with --draft and replaces any existing release+tag for that
# same string in place, instead of erroring or accumulating duplicates. A real numbered
# tag (no -dev) publishes as before. See .agents/skills/make-release/SKILL.md.
#
# Release body comes from the git tag annotation (`gh release create --notes-from-tag`),
# not --generate-notes (PR-only and empty for this repo's direct-to-main flow). Real
# releases use annotated tags with the hand-written notes; lightweight tags fall back
# to the pointed-at commit message (fine for throwaway -dev drafts). Post-publish, CI
# fills the Lines table's Binaries-avg placeholders from the published artifact sizes;
# the tag annotation stays untouched.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs for testing the build itself

permissions:
  contents: write          # gh release create needs to write the release

# One run per ref at a time: re-pushing the SAME tag (dev-draft replace deletes +
# re-tags on the same `-dev` string, and re-cut does the same for a real tag) cancels
# whatever's already running for it, rather than letting two runs race to
# `gh release create` for the same tag and produce a duplicate/conflicting release.
# A different tag gets its own group and is unaffected.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Guard: the pushed tag must equal the single-source version ───────────────
  # The one place of truth is rust/Cargo.toml ([workspace.package] version), read via
  # scripts/release/sync-workspace-version.py --print. Fail fast (before the long platform
  # builds) if a tag like v0.1.0 doesn't match it, so the app zip / portable zip / About
  # string / tag never drift.
  check:
    name: tag = version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches rust/Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ver="$(python3 scripts/release/sync-workspace-version.py --print)"
          tag="${GITHUB_REF_NAME#v}"
          echo "single-source version=$ver  tag=$tag"
          [ "$ver" = "$tag" ] || { echo "::error::tag v$tag != rust/Cargo.toml version $ver — bump the workspace version or fix the tag"; exit 1; }
      - name: apps/linux/gtk/Cargo.toml agrees with rust/Cargo.toml
        # A STANDALONE workspace (see its Cargo.toml header) can't use `version.workspace =
        # true` to inherit from rust/'s [workspace.package] — its own version literal is
        # kept in lockstep by sync-workspace-version.py, so catch drift here rather than
        # shipping it silently.
        run: |
          set -euo pipefail
          ver="$(python3 scripts/release/sync-workspace-version.py --print)"
          gtk_ver="$(grep -m1 '^version = "' apps/linux/gtk/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          echo "rust/Cargo.toml version=$ver  apps/linux/gtk/Cargo.toml version=$gtk_ver"
          [ "$ver" = "$gtk_ver" ] || { echo "::error::apps/linux/gtk/Cargo.toml version ($gtk_ver) != rust/Cargo.toml version ($ver) — bump it to match"; exit 1; }

  # ── Tests gate: run the SAME suite as CI, but across ALL THREE OSes, before
  #    building/publishing (per-commit CI is Linux-only; the release is thorough). ──
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      full-matrix: true

  # ── Windows portable zips (self-contained — x64 + ARM64) ────────────────────
  windows:
    needs: [check, tests]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      # build-portable.ps1 expects per-user toolchains on PATH (~/.dotnet, ~/.cargo). cargo is
      # already there via the preinstalled rustup; install .NET 10 INTO ~/.dotnet so the
      # script's DOTNET_ROOT/PATH assumptions hold with no edits.
      - name: Point .NET install at ~/.dotnet
        shell: pwsh
        run: echo "DOTNET_INSTALL_DIR=$env:USERPROFILE\.dotnet" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'   # the WinUI app targets net10 (WinApp SDK 2.2 + H.NotifyIcon)

      # The ARM64 MSVC tools are already in the image; build-portable.ps1 adds the Rust
      # arm64 target itself.
      - uses: ./.github/actions/ring-asm-windows

      # Runner images lag freshly-released toolchains by days (see ci.yml's hygiene/clippy/
      # test jobs) — pin to current stable explicitly rather than trusting windows-2025's
      # preinstalled rustup default.
      - uses: dtolnay/rust-toolchain@stable

      # key includes matrix.arch: the x64 and arm64 legs cross-compile different Rust
      # targets from the same job name, so the automatic per-job cache key alone would
      # conflate them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ matrix.arch }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('apps/windows/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Self-contained portable zip (bundles .NET + Windows App SDK + engine DLL/helper +
      # dontspeak.exe). -SkipModels keeps it lean — the app downloads the voice models on
      # first launch, the same as macOS/Linux. The one-command installer
      # (scripts/install/web/install.ps1)
      # unzips it and runs `dontspeak wire --reconcile`. Unsigned (runs from an extracted folder).
      - name: Build portable zip (${{ matrix.arch }})
        shell: pwsh
        run: ./apps/windows/installer/build-portable.ps1 -Arch ${{ matrix.arch }} -SkipModels

      - name: Upload portable zip (release artifact)
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-${{ matrix.arch }}
          # dontspeak-<version>-windows-<x86_64|aarch64>.zip — the only zip Output holds.
          path: apps/windows/installer/Output/*.zip
          if-no-files-found: error
          retention-days: 7

  # ── macOS app DMGs (arm64 + x86_64) ─────────────────────────────────────────
  # Both slices build on the arm64 macos-26 runner: arm64 native, x86_64 cross-compiled
  # (Rust via the added target, Swift via `swift build --arch x86_64`). The Intel slice
  # ships WITHOUT the Apple-Silicon-only Core ML shim (libsmkokoro) — its engine ladder
  # resolves to the system `say` voice + claude_code dictation, which need no onnxruntime.
  macos:
    needs: [check, tests]
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      OUTDIR: ${{ github.workspace }}/dist
      DONTSPEAK_ARCHES: 'arm64 x86_64'   # dist-apps.sh builds one .app.zip per arch
    steps:
      - uses: actions/checkout@v7

      # Runner images lag freshly-released toolchains by days (see ci.yml's hygiene/clippy/
      # test jobs) — pin to current stable explicitly rather than trusting macos-26's
      # preinstalled rustup default.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Add Rust apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # librsvg provides `rsvg-convert`, which bundle-lib.sh uses to render the menu-bar
      # glyph AND — critically — the COMPLETE legacy AppIcon.icns (all sizes) from
      # assets/app-icon.svg. Without it the build falls back to actool's 16px+128px stub
      # and the app icon degrades on macOS < 26 (Assets.car's Liquid Glass AppIcon is
      # unreadable there). See .claude/skills/build-macos/SKILL.md → "App icon — dual path".
      - name: Install librsvg (rsvg-convert for the app + menu-bar icons)
        run: brew install librsvg

      # Gate: run the full distribution path (hardened runtime + Developer ID sign +
      # notarize, the dist-apps.sh DONTSPEAK_DIST=1 branch) only when an Apple Developer
      # ID cert is configured; otherwise build ad-hoc (DIST=0). See docs/SIGNING.md.
      - name: Detect Apple signing config
        id: sign
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; fi

      # Import the Developer ID Application cert (+ key) into a temporary keychain so
      # codesign can use it. `security import -P` only accepts the p12 passphrase as a
      # literal argv argument -- no stdin/env option exists (checked `man security`) --
      # which would put CERT_PW in that process's argv, unlike every other secret in
      # this job. Route around it: openssl's `-passin env:` reads the passphrase from
      # the environment (never argv) to decrypt the p12 into an unencrypted PEM, which
      # `security import` then takes with no -P needed at all. The -legacy/no-legacy
      # fallback mirrors ensure_local_sign_identity in scripts/install/lib/common.sh (OpenSSL 3
      # needs -legacy for older RC2/3DES-encrypted p12s; LibreSSL, macOS's system
      # openssl, has no such flag). The decrypted PEM is as sensitive as the .p12 and
      # is removed immediately after import, same as the .p12 already was.
      - name: Import Developer ID certificate
        if: steps.sign.outputs.on == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain"; kcpw="$(openssl rand -hex 16)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          pemok=0
          for legacy in -legacy ""; do
            if /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nodes $legacy \
                 -passin env:CERT_PW -out "$RUNNER_TEMP/cert.pem" 2>/dev/null; then
              pemok=1; break
            fi
          done
          [ "$pemok" = 1 ] || { echo "::error::failed to decrypt APPLE_CERT_P12_BASE64 with APPLE_CERT_PASSWORD"; exit 1; }
          security import "$RUNNER_TEMP/cert.pem" -k "$kc" -T /usr/bin/codesign
          security list-keychains -d user -s "$kc" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      # DONTSPEAK_DIST=1 → bundle libonnxruntime.dylib, hardened-runtime sign inside-out
      # with entitlements, then notarize+staple the .app (via the APPLE_ID trio) and zip it.
      # When unset/0 it ad-hoc-signs and skips notarization — both bundle the app, helper,
      # CLI and shim; only signing/notarization differs. (The SepFormer separator is not
      # bundled — it downloads at runtime like every other model.)
      - name: Build app zips (signed + notarized when configured)
        env:
          DONTSPEAK_DIST: ${{ steps.sign.outputs.on == 'true' && '1' || '0' }}
          # Headless runner: never auto-mint a self-signed local-dev cert + codesign with it —
          # that blocks on a keychain-authorization GUI prompt forever. Ad-hoc sign instead when
          # not doing a real Developer-ID dist build. (No-op in dist mode, which skips autosign.)
          DONTSPEAK_NO_AUTOSIGN: '1'
          DONTSPEAK_CODESIGN_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          DONTSPEAK_APPLE_ID: ${{ secrets.APPLE_ID }}
          DONTSPEAK_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DONTSPEAK_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./apps/macos/dist-apps.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-apps
          path: dist/*.app.zip
          if-no-files-found: error
          retention-days: 7

  # ── Linux tarball ────────────────────────────────────────────────────────────
  # The standalone GTK host (apps/linux/gtk) + the engine bins, packaged by
  # apps/linux/package.sh — the tarball is the ONE Linux package.
  # continue-on-error is scoped per-step (not job-level): it applies ONLY to the
  # tarball-packaging step and its artifact upload below, which are decoupled from
  # code correctness and best-effort by design. checkout, the GTK build deps, the
  # cache restore, and `cargo test` are NOT tolerated — a broken environment or a
  # genuine test regression in apps/linux/gtk must hard-fail this job and block the
  # `release` job's `needs:` gate, same as windows/macos.
  linux:
    needs: [check, tests]
    # The GTK host needs a RECENT GNOME stack — libadwaita >= 1.7 (v1_7) + GTK 4.12 +
    # gtk4-layer-shell — which ubuntu-latest (24.04) is too old for. Ubuntu 26.04 ships
    # libadwaita 1.9 / GTK 4.22 and the layer-shell -dev package (matches windows-2025 /
    # macos-26), so the runner is pinned specifically to get a stack recent enough that
    # the old "libadwaita too old to build" failure this job used to tolerate is no
    # longer expected — that's why build/test steps below are no longer wrapped in
    # continue-on-error.
    # Both arches build NATIVELY (no cross-compiling): x86_64 on ubuntu-26.04, aarch64 on
    # ubuntu-26.04-arm; package.sh derives ARCH/DEB_ARCH from uname -m.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build deps (GTK4 + libadwaita + layer-shell + ALSA + PulseAudio)
        uses: ./.github/actions/linux-build-deps
        with:
          extra: build-essential libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      # Runner images lag freshly-released toolchains by days (see ci.yml's hygiene/clippy/
      # test jobs) — pin to current stable explicitly rather than trusting ubuntu-26.04's
      # preinstalled rustup default.
      - uses: dtolnay/rust-toolchain@stable

      # key includes matrix.arch: x86_64 and aarch64 run on different runner labels but
      # share this job name, so make the cache split explicit rather than relying on the
      # action's automatic per-runner-arch detection.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            apps/linux/gtk -> target
          key: ${{ matrix.arch }}

      # apps/linux/gtk is its own Cargo workspace (not a member of rust/), so
      # `cargo test --workspace` in ci.yml never touches it — this is the only place
      # its unit tests run, and (deliberately) the only OS: ubuntu-26.04, the same
      # image package.sh below builds the shipped tarball on. No continue-on-error
      # here: a compile or test failure must hard-fail the job and block `release`.
      - name: cargo test (GTK host crate)
        working-directory: apps/linux/gtk
        run: cargo test --locked

      # Packaging is best-effort and decoupled from code correctness: continue-on-error
      # here (and on the upload below) keeps a packaging-only failure from blocking the
      # Windows/macOS release, now that the build/test steps above are no longer tolerant.
      - name: Build the Linux tarball
        continue-on-error: true
        run: ./apps/linux/package.sh

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── Publish the GitHub Release with all artifacts ───────────────────────────
  release:
    name: publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    # Only publish a release for an actual tag push (workflow_dispatch just builds).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The fixed-name web installers are release assets sourced from the tagged commit.
      # fetch-tags so annotated-tag bodies are available for --notes-from-tag.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create / update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          export TAG
          DRAFT_ARGS=()
          case "$TAG" in
            *-dev*)
              DRAFT_ARGS+=(--draft)
              # On-demand dev draft: replace any existing release for this same tag in
              # place instead of erroring "already exists" or accumulating a second one.
              # `gh release view/delete <tag>` are unreliable for drafts — GitHub's
              # get-release-by-tag REST endpoint only returns published releases, and
              # `gh release delete <tag>` can match a PUBLISHED release sharing that tag
              # instead — so list + filter by tag_name via the API directly instead.
              # `gh api` has no `--arg` flag (its --jq takes one filter string, not extra
              # positional args — `--jq --arg tag ... '...'` fails with "accepts 1 arg(s),
              # received 4"); use jq's own `env.TAG` builtin against the exported var instead,
              # keeping --paginate to see all pages rather than just the first 30 releases.
              existing_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                --jq '.[] | select(.tag_name==env.TAG) | .id' | head -n1)"
              if [ -n "$existing_id" ]; then
                echo "Replacing existing draft release id=$existing_id for tag $TAG"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$existing_id"
              fi
              ;;
          esac
          # Windows + macOS are required; Linux packages are best-effort (the linux job
          # is continue-on-error) — nullglob drops them silently if the job produced none.
          FILES=(
            artifacts/windows-portable-*/*.zip
            artifacts/macos-apps/*.app.zip
            artifacts/linux-packages-*/*
          )
          INSTALLERS=(
            scripts/install/web/install.sh
            scripts/install/web/install.ps1
          )
          for installer in "${INSTALLERS[@]}"; do
            [ -f "$installer" ] || { echo "missing release installer: $installer" >&2; exit 1; }
          done
          # checksums.txt — sha256 of every platform package, by basename, so the
          # installers can verify each download. The fixed-name installers and checksum
          # manifest are bootstrap assets shipped alongside those packages.
          : > checksums.txt
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            hash=$(sha256sum "$f" | awk '{print $1}')
            # printf pins the published manifest to LF even if this step is later
            # moved to a runner or shell with Windows-native text output.
            printf '%s  %s\n' "$hash" "$(basename "$f")" >> "$GITHUB_WORKSPACE/checksums.txt"
          done
          TITLE="DontSpeak ${TAG}"
          if [ ${#DRAFT_ARGS[@]} -gt 0 ]; then
            TITLE="DontSpeak ${TAG} (dev draft — not a release)"
          fi
          # Notes from the annotated tag body (written at tag time by make-release).
          # --generate-notes only lists merged PRs and is empty for direct-to-main.
          # Lightweight tags: gh falls back to the pointed-at commit message.
          # Do NOT pass --repo here: gh rejects `--notes-from-tag` together with
          # `--repo` ("using --notes-from-tag with --repo is not supported"). The
          # job already runs in this repository; GH_TOKEN + default context is enough.
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-from-tag \
            "${DRAFT_ARGS[@]}" \
            "${FILES[@]}" "${INSTALLERS[@]}" checksums.txt

      # Fill the "## Lines" table's Binaries-avg column with real sizes. At tag time the
      # new release's assets don't exist, so the annotated tag (the immutable notes
      # transport) carries "…" placeholders; this rewrites ONLY those cells against the
      # previous release's published sizes. Soft-fail by design: the release is already
      # live — a stats hiccup must not redden the job. Dev drafts are skipped: their
      # commit-message bodies have no Lines table, and gh release view/edit by tag is
      # unreliable for drafts (see the create step's comment).
      - name: Fill Binaries avg sizes in release notes
        if: ${{ !contains(github.ref_name, '-dev') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export TAG
          # Newest non-draft, non-dev release that isn't the one just created.
          # --jq filters per page; head -n1 takes the newest (list is created-desc).
          prev="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false and .tag_name != env.TAG and ((.tag_name | test("-dev")) | not)) | .tag_name' \
            | head -n1)"
          if [ -z "$prev" ]; then
            echo "no previous release — leaving size placeholders"; exit 0
          fi
          gh release view "$TAG" --json body --jq .body > body.md
          cp body.md body.orig.md
          python3 scripts/release/release-stats.py --patch-sizes body.md --old "$prev" --assets-dir artifacts
          if cmp -s body.md body.orig.md; then
            echo "body unchanged (no Lines table or identical sizes) — skipping edit"; exit 0
          fi
          gh release edit "$TAG" --notes-file body.md
