# DontSpeak Linux GUI host — GTK4 + libadwaita. Hosts the engine in-process via the ds-core
# C ABI; renders tray, health panel, and focus-safe dictation overlay. Standalone (not in
# rust/ workspace): Linux-only GTK deps would otherwise affect macOS/Windows cargo builds.
[package]
name = "ds-linux-gtk"
# Kept in lockstep by `scripts/release/sync-workspace-version.py` after rust/Cargo.toml bumps.
# Standalone workspace can't use `version.workspace = true`; release.yml asserts agreement.
version = "0.3.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "DontSpeak Linux GUI host (GTK4 + libadwaita): tray, health panel, dictation overlay; hosts the engine in-process via ds-core."

# Own lint policy (no rust/ workspace inheritance). Mirrors undocumented_unsafe_blocks.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[[bin]]
name = "ds-gtk"
path = "src/main.rs"

[dependencies]
# gtk-rs lockstep (gtk4 0.11 / libadwaita 0.9 / gtk4-layer-shell 0.8 share one gtk4-sys).
# v4_12 unlocks CssProvider::load_from_string et al.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# v1_7 unlocks AdwInlineViewSwitcher.
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# Engine thread → GTK main loop.
async-channel = "2"
# StatusNotifierItem tray (freedesktop; GTK4 dropped StatusIcon). `blocking` = own DBus thread.
ksni = { version = "0.3", features = ["blocking"] }
# wlr-layer-shell focus-safe dictation overlay (Wayland; X11 fallback in code).
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust SVG → ARGB pixmap for tray glyph. Glyph has no text/raster images, so fonts +
# image decoders stay off.
resvg = { version = "0.47", default-features = false }
sys-locale = "0.3"
ds-core = { path = "../../../rust/crates/ds-core" }
# Typed model_status — no hand-mirrored DTO (unlike Swift/C# hosts).
ds-status = { path = "../../../rust/crates/ds-status" }
# Logs-tab parse/filter pure rules (same as ds_logs_json wire) + `log` sink via ds_log::init.
ds-log = { path = "../../../rust/crates/ds-log" }
log = "0.4"
