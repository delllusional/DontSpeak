[package]
name = "ds-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Config and path resolution for DontSpeak (config.toml, pidfile)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
# Wiring our hooks into OpenAI Codex's `~/.codex/config.toml` without disturbing
# the user's existing config (format-preserving, like the additive settings.json merge).
toml_edit = { workspace = true }
# Serde TOML for OUR own config (our config.toml), which we own outright.
toml = { workspace = true }
# Canonical pidfile codec (read_pid) + the cross-platform pid liveness/terminate
# primitives live in ds-proc; read_engine_pid / is_pid_alive / evict_stale_engine
# delegate to it. ds-proc does NOT depend on ds-config, so no cycle.
ds-proc = { workspace = true }
# Crash-safe writes for config.toml and client integration files.
tempfile = { workspace = true }
# The unified activity log (issue #6 split): VoiceConfig::load logs a warning on
# bad/unknown config.toml keys via this crate's log()/LogLevel.
ds-log = { workspace = true }
# Path-resolution diagnostics via the log facade (ds_log sink).
log = { workspace = true }
# The ONE client-identity enum (`WiredClient`, formerly this crate's `WireTarget`): the
# registry's `target`, `exclude_clients`' element type, and the `--client` token the hook
# wiring stamps. Re-exported flat from lib.rs, so downstream crates keep saying
# `ds_config::WiredClient`.
ds-client = { workspace = true }
# Hermes Agent config.yaml (hooks + mcp_servers). Already in the workspace lock via
# rust-i18n; comment loss on re-emit is accepted (no format-preserving YAML editor).
serde-saphyr = "0.0.29"

[lints]
workspace = true
