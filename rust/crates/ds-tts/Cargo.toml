[package]
name = "ds-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Pluggable TTS engines for DontSpeak: Kokoro (native in-process synth, default) and System (OS voice)."

[dependencies]
ds-config = { workspace = true }
ds-proc = { workspace = true }
# Voice/language enumeration + Gender/Quality/SpeakerVoice (issue #5): split out so the
# `dontspeak` CLI can list voices without the heavy synth deps below. Re-exported under
# this crate's old `enumerate`/`Gender`/`Quality`/`SpeakerVoice` paths (see lib.rs) so
# every existing call site keeps compiling unchanged.
ds-voices = { workspace = true }
# The shared ORT session builder + the Apple MLX Audio shim loader (used by
# synth_mlx). The warm-media helper that unions synth + dictation + AEC is its OWN
# crate now (ds-helper), so this TTS library no longer depends on ds-stt / ds-aec.
ds-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# ── Native Kokoro synthesis ─────────────────────────────────────────────────
# The pure modules (vocab/trim) need NONE of these; the synth path does. `voices`/`say`/
# `enumerate` moved to `ds-voices` (issue #5) — reached here via the re-export shim in
# lib.rs — so they're no longer pure modules of THIS crate. Pinned once in the workspace.
# ONNX inference (load-dynamic: no onnxruntime baked, resolved at runtime).
ort = { workspace = true }
# Released Misaki-compatible English frontend.
voice-g2p = { workspace = true }
# Runtime-load the same prebuilt eSpeak distribution used by MLX Audio/Misaki.
libloading = { workspace = true }
# Native Japanese OpenJTalk and Mandarin pinyin frontends.
jpreprocess = { workspace = true }
jieba-rs = { workspace = true }
pinyin = { workspace = true }
chinese-number = { workspace = true }
# Parse Markdown structurally so narration keeps labels/code but omits markup and link targets.
pulldown-cmark = { workspace = true }
# Report phonemes dropped for being outside Kokoro's vocabulary — the loss must be observable,
# not silent (see g2p::drop_unsupported_phonemes).
log = { workspace = true }
# Chatterbox's HF tokenizer.json (see the workspace pin for the pure-Rust feature choice).
tokenizers = { workspace = true }
# Shared per-utterance language detection before every backend dispatch.
whatlang = { workspace = true }
# 24 kHz mono f32 PCM playback. `symphonia-aiff` (added to the default decoders) lets the
# earcon `cue` op decode macOS system sounds (.aiff); wav (Windows) + vorbis/oga (Linux) are
# already in rodio's defaults.
rodio = { workspace = true, features = ["symphonia-aiff"] }

[dev-dependencies]
# Tempdir-only fixtures (wav round-trip, tokenizer.json fixture) — never live resources.
tempfile = { workspace = true }

[lints]
workspace = true
