[package]
name = "dontspeak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "DontSpeak's CLI: MCP server, Claude Code hook verbs, and client installer — thin clients of the resident engine."

# ONE binary, busybox-style — argv selects the role (see src/main.rs):
#   (no args)        the stdio MCP server (registered with Claude Code)
#   notify           COMMAND hook sink: run the event's side effect, no reply (async)
#   provide          QUERY hook: return the event's hookSpecificOutput JSON (sync)
#   wire <client> …  wire/unwire ONE client's whole integration (claude_code = hooks + MCP,
#                    codex = hooks); `--remove` to unwire
[[bin]]
name = "dontspeak"
path = "src/main.rs"

# Thin bridge: JSON-RPC over stdin/stdout — the ONLY transport. Forwards to the resident
# engine over the ds-ipc client; no HTTP, no async runtime (the workspace's no-tokio
# stance).
[dependencies]
ds-config = { workspace = true }
ds-ipc = { workspace = true }
# The shared streaming-narration core (accumulation, digests, the streaming witness) —
# this crate is the Claude Code / Qwen Code hook ADAPTER over it; the engine's Codex
# app-server subscriber is the third adapter (dontspeakd::codex_stream).
ds-narrate = { workspace = true }
# Voice/language enumeration split out of ds-tts as ds-voices (issue #5): no
# ort/rodio/voice-g2p/grapheme_to_phoneme/ds-model in its graph, so the most-spawned
# artifact in the product (every hook + MCP call) never rebuilds for a synth-stack
# security advisory.
ds-voices = { workspace = true }
# The tool catalog (names/descriptions/schemas) is shared with the app's FFI
# (ds-core) so the list never drifts — this server exposes it, the app shows it.
ds-tools = { workspace = true }
# Mic-active gate for the `narrate --display` hook (was ds-narrate).
ds-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Temp config files for the wire_mcp (MCP registration) tests.
tempfile = { workspace = true }

[lints]
workspace = true
