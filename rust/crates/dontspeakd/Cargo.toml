[package]
name = "dontspeakd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "DontSpeak's voice engine: Caps-Lock dictation, the TTS queue, local STT, and barge-in."

# Library only for PRODUCTION purposes — the engine is ALWAYS hosted in-process by a
# platform host app via the `ds-core` C ABI (macOS DontSpeak.app / Windows ds-winui /
# Linux ds-gtk). There is no standalone headless engine binary any more. The one `[[bin]]`
# below (`dontspeakd-fake-helper`) is NOT that — it's a small test fixture; see its own
# module doc (src/bin/fake_ds_helper.rs) for why it's an always-built, non-test-gated
# `[[bin]]` rather than a headless daemon.

[[bin]]
# Fixture-only fake `ds-helper --serve` for tts::wedge_recovery_tests — see its own doc
# comment (src/bin/fake_ds_helper.rs) for the protocol and why it exists. Explicitly
# named/prefixed rather than left at the auto-discovered bare `fake_ds_helper`, mirroring
# ds-aec's `ds-aec-probe`.
name = "dontspeakd-fake-helper"
path = "src/bin/fake_ds_helper.rs"

[dependencies]
ds-platform = { workspace = true }
ds-proc = { workspace = true }
ds-config = { workspace = true }
# App-process usage probes let MCP share the host's macOS keychain ACL authorization.
ds-agent-usage = { workspace = true }
# Client-wiring reconcile: the engine converges each client's wiring to config.toml's
# declared `exclude_clients` at boot / on config change (the shared home is ds-wire, NOT the
# `dontspeak` CLI crate — so no engine→CLI dependency is introduced).
ds-wire = { workspace = true }
# Audible earcons (reply ding / needs-input cue) — split out of ds-config (issue #6).
ds-earcon = { workspace = true }
# The unified activity log — engine logging + codex-stream diagnostics, split out of
# ds-config (issue #6).
ds-log = { workspace = true }
# Logging facade macros (log::info!/warn!/error!/debug!) — call sites route through
# ds-log's `log::Log` sink installed by `ds_log::init()` in boot.rs.
log = { workspace = true }
ds-ipc = { workspace = true }
ds-model = { workspace = true }
ds-stt = { workspace = true }
ds-engines = { workspace = true }
# The warm helper's stdout reply-token vocabulary — tts.rs's two reader loops parse
# with these consts so they can't drift from what ds-helper emits.
ds-helper-proto = { workspace = true }
# System-`say` wpm mapping (rate_to_wpm) + the shared say-command builder so the
# warm engine's System-TTS path matches ds-tts's spawners exactly.
ds-tts = { workspace = true }
# THE typed model_status schema (the single source of truth this engine PRODUCES;
# the UI FFI consumes the same type). Replaces the old in-crate status_schema.rs.
ds-status = { workspace = true }
# Shared localization catalog — the engine looks up the failure-reason prose it ships in
# model_status (the %{why}) here, so those user-facing strings live in en.yml like the rest.
ds-i18n = { workspace = true }
# The shared streaming-narration core — the engine's Codex app-server subscriber
# (codex_stream) is the third adapter over it (beside the Claude/Qwen hook adapters in
# the `dontspeak` CLI): same per-session state file, same witness, same digests.
ds-narrate = { workspace = true }
# Sync WebSocket client for the codex app-server control socket (WS over UDS) / a
# ws:// TCP override. See the workspace-deps comment for why not the official
# codex protocol crate or the tokio SDK.
tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# TOML (de)serialize for the persisted lifetime stats file (our stats.toml).
toml = { workspace = true }
# Push-based config.toml watch (FSEvents/inotify/ReadDirectoryChangesW) — replaces
# the per-tick stat() poll for hot-reload; a coarse stat backstop remains.
notify = { workspace = true }
# The per-agent voice roll (`ttsq::pick_agent_voice`'s production `roll`).
fastrand = { workspace = true }
getrandom = { workspace = true }

# Kill-on-close Job Object for the engine-owned Windows Codex app-server. This is what
# cleans the child even if the WinUI host crashes or is force-terminated.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
