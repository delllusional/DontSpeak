tray:
  mute: Mute
  quit: Quit                 # macOS
  settings: Settings         # Windows
  exit: Exit                 # Windows
  start_at_login: Start at login   # Windows
  hint_tray_title: "DontSpeak is running"
  hint_tray_body: "Icon is in the tray (under ^ if hidden)."

