  cancel: Cancel

# ─────────────────────────────── AGENTS SCREEN ──────────────────────────────
# Period keys MUST match the `period` wire tokens from ds-agent-usage
# (`session` | `week` | `month`). Hosts look up `usage.<period>` with no
# per-OS switch. Provider titles: `usage.provider.<client_source>`.
usage:
  unavailable: Agents unavailable
  no_data: No usage data
  account_hidden: Account
  needs_auth: "Stats need Keychain access"
  authorize: Authorize
  session: Session
  week: Week
  month: Month
  provider:
    claude: Claude Code
    codex: Codex
    qwen: Qwen Code
    grok: Grok
    kimi: Kimi Code
    hermes: Hermes Agent

