[package]
name = "ds-ipc"
description = "NDJSON RPC over a Unix-domain socket between the engine and its clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Tiny newline-delimited-JSON RPC over a Unix-domain socket. The engine hosts the
# server; the resident host app (via ds-core) and the speak/narrate hooks are clients.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The client-identity enum: the REQUIRED `source` field on every client-originated Request.
# A leaf crate (serde only), so this adds nothing to the graph.
ds-client = { workspace = true }
# Earcon event tokens on Request::Earcon — shared with hooks/engine.
ds-earcon = { workspace = true }

# Windows has no std Unix-domain-socket support, but Win10 1803+ ships AF_UNIX.
# uds_windows wraps it with a std-mirroring UnixListener/UnixStream (incoming(),
# try_clone(), set_read_timeout/set_write_timeout, Read/Write), so the windows
# transport arm is a near-verbatim copy of the unix one — same filesystem-scoped
# .sock security model, no loopback-TCP + auth-token handshake needed.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
# ACL hardening of the socket dir/file in transport::bind() (no chmod-bit model
# on NTFS). Already an MIT dependency used elsewhere in the workspace (ds-platform,
# ds-proc, ds-aec, ds-model) at the same version.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
