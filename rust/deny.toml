# Release dependency policy; the release workflow runs cargo-deny with all features.
[graph]
targets = [
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "tokenizers 0.23.1 is current and still depends on unmaintained paste; the advisory has no safe upgrade" },
]

# Keep the distributable dependency graph within these approved licenses.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = [
]

# Reject new duplicate versions; `skip` is the reviewed baseline for existing splits.
[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [
]
allow-workspace = false
deny = [
]

# Remove entries as upstream dependency trees converge.
skip = [
    { crate = "base64@0.13.1", reason = "tokenizers 0.23.1 uses base64 0.13 through spm_precompiled while the application graph uses 0.22" },
    { crate = "bitflags@1.3.2", reason = "existing transitive split; deny any unlisted duplicate version" },
    { crate = "cpal@0.17.3", reason = "rodio has not yet converged with the workspace's cpal generation" },
    { crate = "getrandom@0.2.17", reason = "existing transitive split; deny any unlisted duplicate version" },
    # rust-i18n 4.2+ (serde-saphyr→ahash) needs 0.3; rand 0.10 / tempfile need 0.4. Irreducible until ahash migrates.
    { crate = "getrandom@0.3.4", reason = "ahash (rust-i18n 4.2) vs getrandom 0.4 (rand 0.10/tempfile); deny any unlisted duplicate version" },
    { crate = "hashbrown@0.14.5", reason = "whatlang 0.16 uses hashbrown 0.14 while indexmap uses 0.17" },
    { crate = "itertools@0.11.0", reason = "rust-i18n 4.2 uses itertools 0.11 while tokenizers uses 0.14" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3's r-efi 5 vs getrandom 0.4's r-efi 6; deny any unlisted duplicate version" },
    { crate = "jni@0.21.1", reason = "existing Android transitive split; deny any unlisted duplicate version" },
    { crate = "jni-sys@0.3.1", reason = "existing Android transitive split; deny any unlisted duplicate version" },
    { crate = "mach2@0.5.0", reason = "existing macOS audio transitive split; deny any unlisted duplicate version" },
    { crate = "nix@0.29.0", reason = "existing transitive split; deny any unlisted duplicate version" },
    { crate = "rand@0.8.7", reason = "existing ML transitive split; deny any unlisted duplicate version" },
    { crate = "rand@0.9.5", reason = "tokenizers 0.23 and proptest use rand 0.9 while rodio and tungstenite use 0.10" },
    { crate = "rand_chacha@0.3.1", reason = "kaldi-native-fbank uses rand 0.8's rand_chacha 0.3 while tokenizers uses rand 0.9's 0.9" },
    { crate = "rand_core@0.6.4", reason = "existing rand transitive split; deny any unlisted duplicate version" },
    { crate = "rand_core@0.9.5", reason = "tokenizers and proptest use rand_core 0.9 while rand 0.10 uses rand_core 0.10" },
    { crate = "rand_distr@0.4.3", reason = "existing ML transitive split; deny any unlisted duplicate version" },
    { crate = "serde_spanned@0.6.9", reason = "legacy TOML transitive tree; deny any unlisted duplicate version" },
    { crate = "thiserror@1.0.69", reason = "existing transitive split; deny any unlisted duplicate version" },
    { crate = "thiserror-impl@1.0.69", reason = "existing transitive split; deny any unlisted duplicate version" },
    { crate = "toml@0.8.23", reason = "legacy TOML transitive tree; deny any unlisted duplicate version" },
    { crate = "toml@0.9.12+spec-1.1.0", reason = "cbindgen (ds-core --all-features) has not yet converged with the workspace's TOML generation" },
    { crate = "toml_datetime@0.6.11", reason = "legacy TOML transitive tree; deny any unlisted duplicate version" },
    { crate = "toml_datetime@0.7.5+spec-1.1.0", reason = "cbindgen (ds-core --all-features) has not yet converged with the workspace's TOML generation" },
    { crate = "toml_edit@0.22.27", reason = "legacy TOML transitive tree; deny any unlisted duplicate version" },
    { crate = "windows-sys@0.45.0", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows-sys@0.52.0", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows-sys@0.60.2", reason = "existing Windows transitive split; deny any unlisted duplicate version" },
    { crate = "windows-targets@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows-targets@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_aarch64_gnullvm@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_aarch64_msvc@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_i686_gnu@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_i686_gnu@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_i686_msvc@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_i686_msvc@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_gnu@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_gnullvm@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_msvc@0.42.2", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "legacy Windows transitive tree; deny any unlisted duplicate version" },
    { crate = "winnow@0.7.15", reason = "legacy TOML transitive tree; deny any unlisted duplicate version" },
]
skip-tree = [
]

# Accept crates.io only; git and unknown registries require an explicit policy change.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
