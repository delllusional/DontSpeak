[workspace]
resolver = "3"
members = [
    "crates/ds-config",
    # The ONE client-identity enum (ClientSource). Sits BELOW ds-log and ds-ipc — ds-log must
    # be able to take a client without depending on ds-config (ds-config depends on ds-log,
    # so that edge would be a cycle), and ds-ipc needs the same type on the wire. Depends on
    # serde only.
    "crates/ds-client",
    # Workspace-wide logging, split out of ds-config (issue #6) — depends on nothing
    # in this workspace, so ds-config can depend on it for its own internal
    # diagnostics without a cycle.
    "crates/ds-log",
    # Audible earcons (OS bundled-sound introspection + cue resolution), split out of
    # ds-config (issue #6) — depends on nothing in this workspace but `directories`
    # (macOS-only) so ds-config doesn't need it for earcon resolution.
    "crates/ds-earcon",
    "crates/ds-ipc",
    "crates/ds-proc",
    "crates/ds-platform",
    # Shared blocking HTTP setup (OS trust roots + bounded small-response reads).
    # Provider semantics stay in their owning crates.
    "crates/ds-http",
    "crates/ds-model",
    # Read-only weekly/monthly quota probes for supported coding agents.
    "crates/ds-agent-usage",
    # Voice/language enumeration split out of ds-tts (issue #5) so the CLI (dontspeak)
    # can list voices without linking ds-tts's heavy synth stack (ort/rodio/voice-g2p/
    # ds-model); ds-tts re-exports this crate's items unchanged.
    "crates/ds-voices",
    "crates/ds-tts",
    "crates/ds-stt",
    "crates/ds-aec",
    # The warm native-media helper BINARY — unions ds-tts + ds-stt + ds-aec into one
    # process (synth + dictation + duplex AEC). Not a library dep of anything; the engine
    # spawns it by path. Kept out of [workspace.dependencies] for that reason.
    "crates/ds-helper",
    # The helper's stdout reply-token vocabulary — shared by the emitter (ds-helper)
    # and the parser (dontspeakd) so the two sides of that wire contract can't drift.
    "crates/ds-helper-proto",
    "crates/ds-engines",
    "crates/ds-tools",
    "crates/ds-i18n",
    "crates/ds-status",
    "crates/ds-narrate",
    # The client-wiring orchestrator + writers, extracted from the `dontspeak` CLI so the
    # engine (dontspeakd) can drive the same reconcile at boot without depending on the CLI.
    "crates/ds-wire",
    "crates/ds-core",
    "crates/dontspeakd",
    "crates/dontspeak",
]

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/delllusional/DontSpeak"
authors = ["Alex Yanchenko <alex@yanchenko.com>"]
# Internal path-dep crates, not (yet) meant for crates.io — makes an accidental
# `cargo publish` a hard error instead of a half-published workspace.
publish = false

# Workspace-wide lint policy; crates opt in via `[lints] workspace = true`. The blanket
# gate stays CI's `cargo clippy -- -D warnings` (ci.yml) — entries here are the specific
# lints we promote beyond clippy's defaults, and they apply to LOCAL builds too, so dev
# and CI can't drift.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Every unsafe block/impl carries a `// SAFETY:` comment (CI's -D warnings promotes this;
# macOS-cfg blocks are outside the Linux/Windows clippy runs — covered by the manual audit
# plus an advisory clippy run on the macOS host next time that code is touched).
undocumented_unsafe_blocks = "warn"

# Shared dependency versions pinned once; crates opt in via `workspace = true`.
[workspace.dependencies]
ringbuf = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
tempfile = "3.27"
# Format-preserving TOML editor for surgically wiring our hooks into OpenAI Codex's
# `~/.codex/config.toml` (keeps the user's existing tables + comments).
toml_edit = "0.25"
# Serde TOML for OUR own config file (our config.toml) — we own the whole
# file, so plain (de)serialize is enough; no format preservation needed.
toml = "1"
# unix-only process-group kill
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
# Cross-platform filesystem watch (config.toml hot-reload): FSEvents on macOS,
# inotify on Linux, ReadDirectoryChangesW on Windows — a push notification in place of
# stat() polling. Default features select the native backend per OS.
notify = "8"
# Windows version-resource embedder: stamps the .exe's FileDescription + ProductName so
# Task Manager / Explorer "Details" show "DontSpeak" instead of the bare exe name. Maintained
# fork of the unmaintained `winres` (which breaks on Rust >= 1.61). Used from build.rs;
# needs rc.exe (Windows SDK) at build time, and the build script no-ops on non-Windows targets.
winresource = "0.1"
# Property-based testing (dev-only). Classic macro API only (`proptest!` /
# `prop_compose!`), not the optional proc-macro attribute variant. MIT OR Apache-2.0.
proptest = "1"
# Local HTTP mock server (dev-only): every outbound-HTTP test points here, never a
# real endpoint (see AGENTS.md's no-real-network invariant).
httpmock = "0.8.3"
# Sync WebSocket framing for the Codex app-server subscriber (dontspeakd::codex_stream).
# The client is generic over `Read + Write`, so it runs over a `UnixStream` (the codex
# control socket carries WebSocket frames over UDS) or a `TcpStream` (the `ws://` config
# override). No TLS features — the endpoints are local. Deliberately NOT the official
# `codex-app-server-protocol` crate (stale on crates.io, drags the full surface) nor the
# tokio SDK (the workspace's no-tokio stance): we hand-write ~8 tolerant serde DTOs.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Logging facade macros (log::info!/warn!/error!/debug!) — call-site API only, zero I/O
# of its own. Already transitively in the graph (via attohttpc, ignore/globset); promoted
# to a direct workspace dep so ds-log can implement `log::Log` as a sink over log_cached.
log = "0.4"
# Already transitively in the graph (via attohttpc / ds-http); direct for JWT payload
# decode in ds-agent-usage (Codex id_token email claim).
base64 = "0.22"
# Small seedable RNG for the per-agent voice roll (dontspeakd::ttsq). Already transitively
# in the graph (via tempfile); chosen over `rand` to add zero new crates. MIT OR Apache-2.0.
fastrand = "2"

# ── Engine dependencies ──────────────────────────────────────────────────────
# Model download (ds-model): tiny blocking HTTP, checksum, atomic rename. We use
# attohttpc (not ureq) because it exposes a socket-level `read_timeout` — a per-
# read INACTIVITY timeout that aborts a stalled CDN mid-download while letting a
# slow-but-progressing 325 MB model finish. ureq 3 dropped that (phase/total
# timeouts only), which is why we moved off it. rustls + bundled webpki roots, no
# native-tls/openssl, no tokio. Crypto provider = `ring` (the `-ring` feature variant),
# NOT the default aws-lc-rs: aws-lc-sys's native crypto won't cross-compile to
# aarch64-pc-windows-msvc, whereas ring supports that target with the configured toolchain.
attohttpc = { version = "0.31", default-features = false, features = ["tls-rustls-webpki-roots-ring"] }
sha2 = "0.11"
# Parse GitHub release tags + the running version for the startup update check
# (ds-model::update_check), so "is a newer release out" is a real semver compare, not a
# string compare (which would misorder e.g. "0.9.0" vs "0.10.0").
semver = "1"
# RFC 3339 provider reset timestamps. Parsing only; native hosts format in the
# user's locale/time zone.
time = { version = "0.3", features = ["parsing"] }
# STT capture/resample (ds-stt, Parakeet): mic capture (cpal) → mono → 16 kHz
# (rubato) → transcribe-rs over the shared `ort` runtime.
cpal = "0.18"
rubato = "4.0"
# Clipboard for the paste-based text injection (ds-platform, macOS target).
arboard = "3"

# ── Native Kokoro TTS ────────────────────────────────────────────────────────
# ONNX inference. `load-dynamic` resolves libonnxruntime at RUNTIME (via
# ORT_DYLIB_PATH), so the HOST build compiles with NO onnxruntime present and the
# binary is not statically baked. default-features=false drops the bundled
# download-binaries strategy (documented as the route-B fallback in ds-model).
# rc.12 needs an `api-N` level alongside `load-dynamic`: ort's Vitis AI EP
# registration (src/ep/vitis.rs) is gated on `load-dynamic`, but the underlying
# ort-sys field `SessionOptionsAppendExecutionProvider_VitisAI` moved behind
# `#[cfg(feature = "api-18")]` in rc.12. `load-dynamic` alone pulls no api-N level,
# so the EP code referenced a field that didn't exist → E0609 (pykeio/ort#547).
#
# We pin `api-24` (rc.12's default level). NOTE: the shipped onnxruntime dylib must be
# ≥ this api level, because ort-sys computes `ORT_API_VERSION = 17 + (#enabled api-N)` and
# at runtime calls `GetApi(ORT_API_VERSION)`, which returns NULL only if the library is
# OLDER than the requested version. api-24 ⇒ requests v24; ds-model ships ONNX
# Runtime 1.27.0, which serves the v24 request fine (a NEWER runtime is backward-compatible
# with an older API request). We ship 1.27 (not 1.24) because 1.24's loader DEADLOCKS on
# the SepFormer speaker-separation graph; 1.27 loads it cleanly. We can't pin the api level
# LOWER than 24 anyway: `transcribe-rs` depends on ort with its DEFAULT features (api-24),
# and cargo unifies features additively. So the dylib VERSION is the knob, not the api level.
#
# `load-dynamic` still wins the build (it sets `ort-sys/disable-linking`, so the
# build script returns before any download even though transcribe-rs co-enables
# `download-binaries`). If ds-model's onnxruntime pin changes, keep it ≥ the ORT
# release whose API version == this `api-N` (api-24 ⇒ ≥ 1.24).
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24", "coreml", "cuda"] }
# Released Misaki-compatible English frontend (MIT). DontSpeak disables its optional
# external espeak-ng fallback and supplies OOV pronunciations in ds-tts instead.
# Exact-pinned: the no-espeak GPL invariant rests on this version's verbatim handling of an
# empty `espeak_path` (see ds-tts::g2p::espeak_free_config) — audit that before any bump.
voice-g2p = "=0.2.2"
# CommonMark parser used to turn rendered agent replies into prose before G2P.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# Audio playback of raw f32 mono PCM at 24 kHz.
rodio = "0.22"
# Extract libonnxruntime.dylib from the microsoft .tgz (ds-model route A).
flate2 = "1"
tar = "0.4"

# ── Target-specific deps (version pinned once; features stay per-member) ─────
# Win32 API bindings. NO features here — each member opts into exactly the Win32
# feature gates it calls; cargo unifies them additively across the workspace.
windows = "0.62"
# Runtime dlopen of dylibs we deliberately don't link at build time (the FluidAudio
# Core ML / ANE shim, NVML) — resolved by env var/path, like ort's load-dynamic.
libloading = "0.9"
# Read Claude Code's OAuth JSON from its macOS Keychain item without allowing
# authentication UI. Other platforms keep using the protected credentials file.
security-framework = "3.7"
# Raw libc calls std doesn't wrap (RTLD_GLOBAL dlopen preloads, thread QoS).
libc = "0.2"
# Zip reader for model archives (Windows ONNX Runtime .zip, Linux CUDA wheels).
# deflate-only (the format MS/PyPI use); no bzip2/zstd/aes to keep it lean —
# flate2 is already in the graph.
zip = { version = "8", default-features = false, features = ["deflate"] }

# ── macOS platform deps ──────────────────────────────────────────────────────
# objc2 tree used by ds-platform (NSWorkspace frontmost-app check). The native
# macOS GUI is the SwiftUI app (macos/), not a Rust crate — the old Slint tray
# (slint / tray-icon / muda) has been removed.
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"

# internal crates
ds-config = { path = "crates/ds-config" }
ds-client = { path = "crates/ds-client" }
ds-log = { path = "crates/ds-log" }
ds-earcon = { path = "crates/ds-earcon" }
ds-ipc = { path = "crates/ds-ipc" }
ds-proc = { path = "crates/ds-proc" }
ds-platform = { path = "crates/ds-platform" }
ds-http = { path = "crates/ds-http" }
ds-model = { path = "crates/ds-model" }
ds-agent-usage = { path = "crates/ds-agent-usage" }
ds-voices = { path = "crates/ds-voices" }
ds-tts = { path = "crates/ds-tts" }
ds-stt = { path = "crates/ds-stt" }
ds-aec = { path = "crates/ds-aec" }
ds-helper-proto = { path = "crates/ds-helper-proto" }
ds-engines = { path = "crates/ds-engines" }
ds-tools = { path = "crates/ds-tools" }
ds-i18n = { path = "crates/ds-i18n" }
ds-status = { path = "crates/ds-status" }
ds-narrate = { path = "crates/ds-narrate" }
ds-wire = { path = "crates/ds-wire" }
dontspeakd = { path = "crates/dontspeakd" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Release profile for the ds-core FFI STATICLIB the macOS SwiftUI app links
# (opt in with `cargo build --profile release-ffi -p ds-core`). It inherits
# `release` (LTO, opt-level=3) but does NOT strip: a stripped `.a` loses the
# `#[no_mangle] extern "C"` symbol table, so the Swift linker can't resolve
# `-lds_core`. apps/macos/build.sh uses this profile.
[profile.release-ffi]
inherits = "release"
strip = false
lto = false
# Override release's panic="abort" so ffi.rs's catch_unwind guard can actually
# catch a panic and return the documented default instead of aborting the host
# SwiftUI app. This only adds unwind tables to the FFI staticlib; correct-path
# codegen and the Swift symbol link are unaffected.
panic = "unwind"
